[package]
name = "va-system-audio"
description = "Przechwytywanie dźwięku systemowego (Core Audio process tap) dla trybu spotkania."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
testing = []

[dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "block2", "dispatch2", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSProcessInfo", "NSString", "NSUUID", "NSValue"] }
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
hound.workspace = true
